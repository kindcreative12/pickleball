<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pickleball</title>
    <style>
      :root {
        color-scheme: dark;
        --court: #2f7d5b;
        --ink: #f2f5f4;
      }
      * { box-sizing: border-box; }
      html, body {
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #14201c;
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #wrap { position: relative; }
      canvas {
        display: block;
        /* Keep the court fully on screen in landscape without overflowing the
           viewport height. 1.96 is the canvas aspect ratio. */
        width: min(96vw, 1100px, calc(88dvh * 1.96));
        height: auto;
        border-radius: 10px;
        background: #14201c;
      }
      #hud {
        position: absolute;
        inset: 12px 12px auto 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #score { font-size: 26px; font-weight: 650; letter-spacing: 0.02em; }
      #message { opacity: 0.85; text-align: right; }
      #menu {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(10, 18, 15, 0.88);
        border-radius: 10px;
        z-index: 20;
      }
      form {
        display: grid;
        gap: 10px;
        width: min(320px, 80%);
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      label { font-size: 13px; opacity: 0.75; }
      input, select, button {
        font: inherit;
        /* 16px keeps iOS Safari from zooming the page on focus. */
        font-size: 16px;
        padding: 9px 11px;
        border-radius: 7px;
        border: 1px solid #3b4f47;
        background: #1b2a25;
        color: var(--ink);
      }
      form button {
        margin-top: 6px;
        background: var(--court);
        border-color: transparent;
        font-weight: 600;
        cursor: pointer;
      }
      form button:hover { filter: brightness(1.08); }
      #hint { margin: 10px 0 0; font-size: 13px; opacity: 0.6; text-align: center; }
      #error { color: #ff9a8a; font-size: 13px; min-height: 1em; }

      /* --- touch controls --- */
      #touch {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        touch-action: none;
      }
      #touch[hidden] { display: none; }
      #stickzone {
        position: absolute;
        inset: 0 45% 0 0;
        pointer-events: auto;
        touch-action: none;
      }
      #stick {
        position: fixed;
        width: 132px;
        height: 132px;
        margin: -66px 0 0 -66px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.07);
        opacity: 0;
        transition: opacity 120ms ease;
        pointer-events: none;
        display: grid;
        place-items: center;
      }
      #knob {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        will-change: transform;
      }
      #power {
        position: absolute;
        right: max(22px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
        width: 108px;
        height: 108px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(47, 125, 91, 0.5);
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.04em;
        pointer-events: auto;
        touch-action: none;
      }
      #power.on {
        background: rgba(90, 200, 150, 0.85);
        transform: scale(0.94);
      }
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        place-items: center;
        text-align: center;
        padding: 24px;
        background: #14201c;
      }
      /* Portrait on a touch device leaves the court unreadably small. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: grid; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="1100" height="560"></canvas>
      <div id="hud">
        <div id="score"></div>
        <div id="message"></div>
      </div>
      <div id="menu">
        <form id="join">
          <h1>Pickleball</h1>
          <div>
            <label for="name">Name</label>
            <input id="name" maxlength="16" placeholder="Player" autocomplete="off" />
          </div>
          <div>
            <label for="room">Room code</label>
            <input id="room" maxlength="24" placeholder="court" autocomplete="off" />
          </div>
          <div>
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="singles">Singles (1v1)</option>
              <option value="doubles">Doubles (2v2)</option>
            </select>
          </div>
          <button type="submit">Join</button>
          <div id="error"></div>
          <p id="hint">Move with WASD or arrows · hold Shift to drive the ball</p>
        </form>
      </div>
    </div>

    <div id="touch" hidden>
      <div id="stickzone"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="power" type="button">POWER</button>
    </div>

    <div id="rotate"><p>Turn your phone sideways to play.</p></div>

    <!-- Relative, not absolute: GitHub Pages serves this from /<repo>/. -->
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
